<style>
body{margin:0;display:flex;min-height:100vh;font:16px/1.5 system-ui,sans-serif;color:#172235;background:#f3f5f8} aside{width:220px;background:#152b49;color:white;padding:18px;flex-shrink:0} aside.collapsed{width:90px} aside.collapsed .label{display:none} aside button{display:block;width:100%;margin:8px 0;text-align:left;background:transparent;color:white;border:1px solid #8da5c5;border-radius:7px;padding:9px;cursor:pointer} aside button[aria-current]{background:#345887} main{padding:24px;max-width:1440px;min-width:0;flex:1} .panel{background:white;border:1px solid #d9e0eb;border-radius:10px;padding:18px;margin:14px 0;overflow:auto} button,select,input{font:inherit;padding:7px;border:1px solid #8593a6;border-radius:5px;background:white;color:#172235}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #265fc7;outline-offset:2px}button:disabled{opacity:.55;cursor:not-allowed} table{width:100%;border-collapse:collapse} td,th{padding:9px;text-align:left;border-bottom:1px solid #ddd}th button{font-weight:bold} .tabs{display:flex;gap:6px;flex-wrap:wrap} .tabs [aria-selected=true]{background:#183f7d;color:white} .bar{height:12px;background:#dbe5f1;border-radius:12px;overflow:hidden}.bar i{display:block;height:100%;background:#397ac5} .metric{display:grid;grid-template-columns:minmax(170px,1fr) minmax(100px,2fr) minmax(85px,auto);align-items:center;gap:12px;padding:7px;border-bottom:1px solid #eee}.skill-trend{padding:0 8px 12px} .muted{color:#4a596b} .frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .cb img,.choices img{max-width:100%;height:auto} .choice-row{border:1px solid #a9b8ca;border-radius:7px;margin:8px 0;padding:10px;display:flex;gap:12px}.badge{font-weight:bold;margin-right:10px}.cb table{border-collapse:collapse;max-width:100%}.cb td,.cb th{border:1px solid #8593a6;padding:7px}.cb .qtable,.cb figure{overflow-x:auto}.cb img.minl{vertical-align:middle;zoom:.29}.cb img:not(.minl){max-width:100%;height:a
