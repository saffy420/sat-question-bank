name = "sat-question-bank-local-production-entry"
main = "src/index.js"
compatibility_date = "2024-12-16"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[durable_objects.bindings]]
name = "LESSON_ROOM"
class_name = "LessonRoom"

[[migrations]]
tag = "lesson-room-v1"
new_sqlite_classes = ["LessonRoom"]

# The students list recomputes stale students through this binding to the Worker itself, a few per
# call, so each chunk gets its own CPU limit (src/index.js staleRows; docs/perf/free-plan-budget.md).
[[services]]
binding = "ADMIN_STATS"
service = "sat-question-bank-local-production-entry"
entrypoint = "adminStats"

[[d1_databases]]
binding = "DB"
database_name = "sat_local_e2e_core"
database_id = "00000000-0000-4000-8000-0000000000e1"

[[d1_databases]]
binding = "AI_DB"
database_name = "sat_local_e2e_ai"
database_id = "00000000-0000-4000-8000-0000000000e2"
